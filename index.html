<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Relógio Flip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relógio">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#000;--card:#1d1d1f;--card2:#161618;--txt:#f2f2f2;--sub:#9a9a9f;--line:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#app{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around;padding:2vh 0}
#clock{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.card{position:relative;font-size:50vw;width:1.2em;height:1.02em;line-height:1.02em;margin:1.2vw 0;
  -webkit-perspective:900px;perspective:900px;font-weight:700;font-variant-numeric:tabular-nums}
.card.sec{font-size:24vw}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);color:var(--txt)}
.half span{position:absolute;left:0;right:0;top:0;height:200%;text-align:center;line-height:1.02em}
.up{top:0;border-radius:.07em .07em 0 0;border-bottom:1px solid var(--line)}
.down{bottom:0;border-radius:0 0 .07em .07em;background:var(--card2)}
.down span{top:-100%}
.fl{display:none;z-index:2;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.fl-up{top:0;-webkit-transform-origin:50% 100%;transform-origin:50% 100%;border-radius:.07em .07em 0 0}
.fl-down{bottom:0;-webkit-transform-origin:50% 0;transform-origin:50% 0;background:var(--card2);border-radius:0 0 .07em .07em;
  -webkit-transform:rotateX(90deg);transform:rotateX(90deg)}
.fl-down span{top:-100%}
.go .fl{display:block}
.go .fl-up{-webkit-animation:fu .28s ease-in forwards;animation:fu .28s ease-in forwards}
.go .fl-down{-webkit-animation:fd .28s .28s ease-out forwards;animation:fd .28s .28s ease-out forwards}
@-webkit-keyframes fu{to{-webkit-transform:rotateX(-90deg)}}
@keyframes fu{to{transform:rotateX(-90deg)}}
@-webkit-keyframes fd{to{-webkit-transform:rotateX(0)}}
@keyframes fd{to{transform:rotateX(0)}}
#date{text-align:center;line-height:1.25}
#wd{font-size:9vw;font-weight:700;text-transform:capitalize}
#dt{font-size:6.2vw;color:var(--sub);font-weight:500}
@media (orientation:landscape){
  #app{padding:1vh 0}
  #clock{-webkit-flex-direction:row;flex-direction:row}
  .card{font-size:44vh;margin:0 1.4vh}
  .card.sec{font-size:20vh}
  #wd{font-size:9vh}
  #dt{font-size:6.2vh}
}
#snd{position:fixed;right:10px;bottom:8px;background:transparent;color:var(--sub);border:1px solid #333;border-radius:14px;
  padding:6px 12px;font-size:13px;font-family:inherit;z-index:5;-webkit-appearance:none}
#nt{position:fixed;left:10px;bottom:8px;background:transparent;color:var(--sub);border:1px solid #333;border-radius:14px;
  padding:6px 12px;font-size:13px;font-family:inherit;z-index:5;-webkit-appearance:none}
body.night{--txt:#9c3a1c;--sub:#5a2312;--card:#0c0605;--card2:#080403}
body.night .card.sec{display:none}
body.night #snd,body.night #nt{border-color:#2a110a}
body.night #wd{font-size:7vw}
body.night #dt{font-size:5vw}
@media (orientation:landscape){body.night #wd{font-size:7vh}body.night #dt{font-size:5vh}}
#cuco{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.95);
  -webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center;text-align:center}
#cuco.on{display:-webkit-flex;display:flex}
#cuco svg{width:58vmin;height:58vmin}
#ttl{font-size:8vmin;font-weight:700;margin:0 0 2vmin}
#cnt{font-size:6vmin;color:var(--sub);margin-top:2vmin;height:1.2em}
#bird{-webkit-transform:translateY(62px);transform:translateY(62px);
  -webkit-transition:-webkit-transform .22s ease-out;transition:transform .22s ease-out}
#cuco.pop #bird{-webkit-transform:translateY(0);transform:translateY(0)}
#cuco.pop #lb{-webkit-animation:bk .16s infinite alternate;animation:bk .16s infinite alternate}
@-webkit-keyframes bk{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(3px)}}
@keyframes bk{from{transform:translateY(0)}to{transform:translateY(3px)}}
</style>
</head>
<body>
<div id="app">
  <div id="clock">
    <div class="card" id="h"></div>
    <div class="card" id="m"></div>
    <div class="card sec" id="s"></div>
  </div>
  <div id="date"><div id="wd"></div><div id="dt"></div></div>
</div>
<button id="nt" type="button">🌙 Auto</button>
<button id="snd" type="button">🔇 Toque para ativar o som do cuco</button>
<div id="cuco">
  <div id="ttl">Meio-dia!</div>
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs><clipPath id="cp"><rect x="75" y="95" width="50" height="60" rx="4"/></clipPath></defs>
    <polygon points="15,85 100,18 185,85" fill="#6b3f1d"/>
    <rect x="35" y="82" width="130" height="108" rx="4" fill="#8a5a2b"/>
    <rect x="75" y="95" width="50" height="60" rx="4" fill="#1a0f06"/>
    <g clip-path="url(#cp)"><g id="bird">
      <ellipse cx="100" cy="146" rx="18" ry="22" fill="#e8b43c"/>
      <circle cx="100" cy="116" r="12" fill="#f0c14b"/>
      <circle cx="104" cy="113" r="2.2" fill="#000"/>
      <polygon points="110,112 130,115 110,118" fill="#e25b2c"/>
      <polygon id="lb" points="110,119 127,122 110,123" fill="#c94a1e"/>
    </g></g>
    <rect x="72" y="155" width="56" height="5" rx="2" fill="#5a3516"/>
    <circle cx="100" cy="58" r="7" fill="#e8c27a"/>
  </svg>
  <div id="cnt"></div>
</div>
<script>
(function(){
  var DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  function two(n){return n<10?"0"+n:""+n;}
  function make(id){
    var el=document.getElementById(id);
    el.innerHTML='<div class="half up"><span></span></div><div class="half down"><span></span></div>'+
      '<div class="half fl fl-up"><span></span></div><div class="half fl fl-down"><span></span></div>';
    var sp=el.getElementsByTagName("span");
    return {el:el,up:sp[0],down:sp[1],fu:sp[2],fd:sp[3],val:null,t:null};
  }
  function set(c,v){
    if(c.val===v)return;
    if(c.val===null){c.up.textContent=c.down.textContent=v;c.val=v;return;}
    clearTimeout(c.t);
    c.down.textContent=c.val;
    c.fu.textContent=c.val;
    c.up.textContent=v;
    c.fd.textContent=v;
    c.val=v;
    c.el.className=c.el.className.replace(" go","");
    void c.el.offsetWidth;
    c.el.className+=" go";
    c.t=setTimeout(function(){
      c.down.textContent=c.val;
      c.el.className=c.el.className.replace(" go","");
    },600);
  }
  var H=make("h"),M=make("m"),S=make("s");
  var wd=document.getElementById("wd"),dt=document.getElementById("dt");
  function tick(){
    var d=new Date();
    set(H,two(d.getHours()));set(M,two(d.getMinutes()));set(S,two(d.getSeconds()));
    wd.textContent=DIAS[d.getDay()];
    dt.textContent=d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
  }
  /* ---- Cuco do meio-dia ---- */
  var CUCOS=12;
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null,master=null,lastKey="",timers=[];
  var ov=document.getElementById("cuco"),ttl=document.getElementById("ttl"),
      cnt=document.getElementById("cnt"),snd=document.getElementById("snd");
  function note(f,t,dur,out){
    var o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain();
    o.type="sine";o2.type="sine";
    o.frequency.setValueAtTime(f*1.03,t);
    o.frequency.exponentialRampToValueAtTime(f,t+.06);
    o2.frequency.setValueAtTime(f*2,t);
    g2.gain.value=.12;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.6,t+.025);
    g.gain.setValueAtTime(.6,t+dur*.6);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(out);
    o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
  }
  function stopCuco(){
    for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);
    timers=[];
    if(master){try{master.gain.value=0;}catch(e){}}
    ov.classList.remove("on");
    ov.classList.remove("pop");
  }
  function startCuco(n,title){
    stopCuco();
    ttl.textContent=title;
    cnt.textContent="";
    ov.classList.add("on");
    if(ctx){master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);}
    for(var i=0;i<n;i++){(function(i){
      timers.push(setTimeout(function(){cnt.textContent="Cuco "+(i+1)+" / "+n;ov.classList.add("pop");},100+i*1000));
      timers.push(setTimeout(function(){ov.classList.remove("pop");},100+i*1000+720));
      if(ctx){var t=ctx.currentTime+.1+i;note(784,t,.22,master);note(659,t+.27,.34,master);}
    })(i);}
    timers.push(setTimeout(stopCuco,n*1000+700));
  }
  function checkNoon(d){
    if(d.getHours()===12&&d.getMinutes()===0&&d.getSeconds()<10){
      var key=d.toDateString();
      if(key!==lastKey){lastKey=key;startCuco(CUCOS,"Meio-dia!");}
    }
  }
  snd.addEventListener("click",function(){
    if(!AC){snd.textContent="Som não suportado neste navegador";return;}
    if(!ctx){
      ctx=new AC();
      var b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();
      s.buffer=b;s.connect(ctx.destination);s.start(0);
    }
    if(ctx.resume)ctx.resume();
    snd.textContent="🔊 Som ativado · toque para testar";
    startCuco(2,"Cuco!");
  },false);
  ov.addEventListener("click",stopCuco,false);

  /* ---- Modo noturno ---- */
  var NOITE_INICIO=22,NOITE_FIM=6; /* automático: das 22h às 6h */
  var nt=document.getElementById("nt"),modo="auto",noite=false;
  try{var sv=localStorage.getItem("modoNoturno");if(sv==="auto"||sv==="on"||sv==="off")modo=sv;}catch(e){}
  var LABELS={auto:"🌙 Auto",on:"🌙 Ligado",off:"☀️ Desligado"};
  function ehNoite(d){
    var h=d.getHours();
    return NOITE_INICIO>NOITE_FIM?(h>=NOITE_INICIO||h<NOITE_FIM):(h>=NOITE_INICIO&&h<NOITE_FIM);
  }
  function aplicaNoite(){
    var on=modo==="on"||(modo==="auto"&&ehNoite(new Date()));
    if(on!==noite||nt.textContent!==LABELS[modo]){
      noite=on;
      if(on)document.body.classList.add("night");else document.body.classList.remove("night");
      nt.textContent=LABELS[modo];
    }
  }
  nt.addEventListener("click",function(){
    modo=modo==="auto"?"on":(modo==="on"?"off":"auto");
    try{localStorage.setItem("modoNoturno",modo);}catch(e){}
    aplicaNoite();
  },false);

  tick();aplicaNoite();
  setInterval(function(){tick();checkNoon(new Date());aplicaNoite();},250);
  document.addEventListener("touchmove",function(e){e.preventDefault();},false);
})();
</script>
</body>
</html>
